<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8" />
     <title>Personal Blog</title>
     <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body>
    <header>
        <button id="toggleMode">&#9728;</button>
    </header>

    <div id="container">
        <div id="leftside"> 
            <h1>My First Blog</h1>
        </div>
        <div id="divider"></div>
        <div id="rightside">
            <form id="blogForm">
                <h2>Whats On Your Mind?</h2>
                <div>
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" placeholder="type username here" />
                </div>
                <br>
                <div>
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" placeholder="type title here" />
                </div>
                <br>
                <div>
                    <label for="content">Content:</label>
                    <input type="text" id="content" name="content" placeholder="type content here" />
                </div>
                <br>
                <button id="submitbtn" type="submit">Submit</button>
            </form>
        </div>
    </div>
            
<script src="./assets/js/form.js"></script>   
</body>
</html>
